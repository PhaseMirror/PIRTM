[package]
name = "pirtm-tools"
version = "0.1.0"
edition = "2021"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Multiplicity-Foundation/phase-mirror"
homepage = "https://phase-mirror.ai"
rust-version = "1.85"

[dependencies]
pirtm-parser = { path = "../pirtm-parser" }
rustyline = "14.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tower-lsp = "0.20.0"
tokio = { version = "1", features = ["full"] }
