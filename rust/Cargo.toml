[workspace]
members = [
    "pirtm-parser",
    "pirtm-app-lexer",
    "pirtm-kernel-lexer",
    "pirtm-compiler",
    "pirtm-mlir",
    "pirtm-stdlib",
    "pirtm-rs",
    "telemetry-recorder",
    "pirtm-monitor",
    "pirtm-engine",
    "pirtm-mcp",
    "pirtm-telemetry",
    "pirtm-invariants",
    "pirtm-tensor",
    # Integrated from Foundry/packages/rust — see ADR-031
    "adr_rust",
    "adr-verifier",
    "pirtm-registry",
    "pirtm-dist",
    "pirtm-orchestration",
    "pirtm-tools",
    "pirtm-web-sdk",
    "pirtm-goldilocks",
    "pirtm-daemon",
    "pirtm-tui",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
thiserror = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
uint = "0.9"
rayon = "1.8"
bytemuck = "1.14"
anyhow = "1.0"
nalgebra = "0.32"
argmin = "0.6"
goldilocks = { path = "crates/goldilocks" }
tracing = "0.1"
chrono = "0.4"
schemars = "0.8"
uuid = { version = "1.3", features = ["v4", "serde"] }
sha2 = "0.10"
lean-rs = "0.4"
lean-rs-host = "0.4"
lean-toolchain = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
# Dependencies added for Foundry integration (ADR-031)
num-prime = "0.4"
itertools = "0.13"
clap = { version = "4.4", features = ["derive"] }
rustyline = "14.0"
tower-lsp = "0.20.0"
tokio = { version = "1", features = ["full"] }
