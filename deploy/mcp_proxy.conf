# mcp_proxy.conf
# Route external HTTPS traffic to the local PIRTM MCP daemon on cPanel Apache
# Place at: /etc/apache2/conf.d/userdata/ssl/2_4/YOUR_CPANEL_USER/mcp.pirtm.com/mcp_proxy.conf

<IfModule mod_proxy.c>
    ProxyPreserveHost On
    
    # Disable timeout for long-lived Server-Sent Events (SSE) and JSON-RPC streams
    ProxyTimeout 3600

    # Route WebSocket/Upgrade requests (if MCP transitions to WS)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:8090/$1 [P,L]

    # Standard HTTP/JSON-RPC routing to the local daemon
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
</IfModule>
