name: Sedona Spine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/elan@v1
        with:
          toolchain: leanprover/lean4:v4.33.0-rc2
      - run: lake build
